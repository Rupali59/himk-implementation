# Human Activity Recognition (HIMK) — Docker Compose
# Build from repo root (Thesis/):  docker compose -f implementation/docker-compose.yml up --build -d
# Or from implementation/:  docker compose -f docker-compose.yml --project-directory .. up --build -d

name: himk-implementation

services:
  mongo:
    image: mongo:7
    container_name: himk-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    name: himk-app
    image: himk-implementation:latest
    build:
      context: ..
      dockerfile: implementation/Dockerfile
    container_name: himk-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5050}:5050"
    environment:
      PORT: "5050"
      THESIS_PDF_PATH: "/app/thesis.pdf"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-himk}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s

volumes:
  mongo_data:
